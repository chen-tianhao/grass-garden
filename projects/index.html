<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#dce5ce">
<title>Projects · Grassrabbit</title>
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
<style>
  :root{color-scheme:light;--paper:#f5f3e8;--ink:#293c32;--serif:Lora,Georgia,"Times New Roman",serif}
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    min-height:100svh;display:grid;place-items:center;padding:32px;
    background:#dce5ce;color:var(--ink);font-family:var(--serif);
    -webkit-font-smoothing:antialiased;
  }
  main{max-width:640px}
  h1{font-size:clamp(40px,7vw,72px);font-weight:400;margin:0 0 20px;letter-spacing:.02em}
  p{font-size:22px;line-height:1.6;margin:0 0 1em}
  a{color:inherit;text-underline-offset:6px}
  a:focus-visible{outline:2px solid currentColor;outline-offset:8px}
</style>
</head>
<body>
<main>
  <h1>Projects</h1>
  <p>Growing soon.</p>
  <p><a href="/">← Back to the garden</a></p>
</main>
</body>
</html>
