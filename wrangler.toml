# ==============================================================================
# Cloudflare Pages · grass-garden
#
# 部署方式：Git 集成。push 到 master 后 Cloudflare 自动构建并发布。
# 本项目是零依赖静态站，源码就在仓库根目录，因此发布目录为根（"."）。
#
# 注意：不要写成 Workers 的 [assets] 配置 —— 本项目是 Pages 项目，
# 两者配置不通用。本地手动发布时用：
#   npx wrangler pages deploy dist --project-name grass-garden --branch master
# ==============================================================================
name = "grass-garden"
compatibility_date = "2025-01-01"
pages_build_output_dir = "."
