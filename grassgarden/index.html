<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Garden</title>
<meta name="description" content="A quiet garden. Scroll to walk through it.">
<meta name="theme-color" content="#f5f3e8">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main id="viewport" aria-label="A little garden: scroll or use arrow keys to walk through it">
  <div id="scene" data-direction="forward"></div>

  <button id="scroll-cue" type="button" aria-label="Scroll down to continue">Scroll down <span aria-hidden="true">&darr;</span></button>
  <p id="scene-status" role="status" aria-live="polite">Garden</p>
</main>
<noscript><p style="padding:24px">The garden needs JavaScript to grow.</p></noscript>

<script src="motion-data.js"></script>
<script src="art.js"></script>
<script src="player.js"></script>
<script src="garden.js"></script>
</body>
</html>
